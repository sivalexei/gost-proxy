name: CI — gost-proxy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm build-essential curl netcat-openbsd

      - name: Build
        run: make all

      - name: Unit tests
        run: make test

      - name: Werror check
        run: make sanitize-werror

      - name: AddressSanitizer
        run: make asan MODE=asan

      - name: UndefinedBehaviorSanitizer
        run: make asan MODE=ubsan

  integration:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm build-essential curl netcat-openbsd

      - name: Build
        run: make all

      - name: Start test servers
        run: |
          # Start server in background
          ./build/gost-server tests/test-server.json &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Start client in background (local loopback)
          ./build/gost-client tests/test-client.json &
          CLIENT_PID=$!
          echo "Client PID: $CLIENT_PID"

          # Save PIDs
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "CLIENT_PID=$CLIENT_PID" >> $GITHUB_ENV

          # Wait for SOCKS5 to be ready
          echo "Waiting for SOCKS5 proxy..."
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 11081 2>/dev/null; then
              echo "SOCKS5 proxy is ready"
              break
            fi
            sleep 1
          done

      - name: Run HTTPS tests
        run: |
          chmod +x tests/test-https.sh
          ./tests/test-https.sh example.com 11081

      - name: Check CPS handshake
        run: |
          if grep -q "CPS\|handshake\|challenge" /tmp/gost-proxy-client-ci.log 2>/dev/null; then
            echo "✅ CPS handshake detected"
            grep -i "CPS\|handshake" /tmp/gost-proxy-client-ci.log | head -5
          else
            echo "⚠️  CPS handshake not found in logs (may be normal for localhost)"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-logs
          path: |
            /tmp/gost-proxy-client-ci.log
            /tmp/gost-proxy-server-ci.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.SERVER_PID }} 2>/dev/null || true
          kill ${{ env.CLIENT_PID }} 2>/dev/null || true
          sleep 1
          kill -9 ${{ env.SERVER_PID }} 2>/dev/null || true
          kill -9 ${{ env.CLIENT_PID }} 2>/dev/null || true
