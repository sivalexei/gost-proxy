# ГОСТ Прокси-Сервер — Конфигурация
# /etc/gost-proxy/server.conf

# Порт сервера
port=10443

# Адрес для прослушивания (0.0.0.0 = все интерфейсы)
bind=0.0.0.0

# Максимальное количество сессий
max_sessions=256

# Ключ шифрования (256 бит, hex)
# ВНИМАНИЕ: Измените на свой ключ в producción!
key=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF

# Таймаут сессии (секунды)
session_timeout=300

# Rate limit (пакетов в секунду на сессию)
rate_limit=1000

# Логирование
log_level=info
log_file=/var/log/gost-proxy/server.log
